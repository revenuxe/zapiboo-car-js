version: 1
env:
  variables:
    # This switches Nitro from its Vercel output to Amplify's SSR deployment
    # specification (.amplify-hosting with static assets and compute server).
    NITRO_PRESET: aws_amplify
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
